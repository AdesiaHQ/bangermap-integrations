name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        type: choice
        options:
          - both
          - mcp
          - n8n
        default: both

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check the shared engine still passes its tests
        run: npm ci && npm test

      - name: Build and publish each selected package with provenance
        env:
          CHOICE: ${{ inputs.package }}
        run: |
          set -eu
          for pkg in mcp n8n; do
            if [ "$CHOICE" != "both" ] && [ "$CHOICE" != "$pkg" ]; then
              continue
            fi
            echo "::group::$pkg"
            (
              cd "$pkg"
              npm ci
              if [ "$pkg" = "n8n" ]; then
                npm run lint
              fi
              npm run typecheck
              npm run build
              NAME=$(node -p "require('./package.json').name")
              VERSION=$(node -p "require('./package.json').version")
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION is already on npm, skipping"
              else
                npm publish --provenance --access public
              fi
            )
            echo "::endgroup::"
          done
